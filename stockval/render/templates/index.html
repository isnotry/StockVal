<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[[TITLE]]</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0e1a;color:#e2e8f0;font-family:'SF Mono','Monaco','Cascadia Code','Consolas',monospace;line-height:1.5}
  .wrap{max-width:1280px;margin:0 auto;padding:28px 20px 60px}
  .hero{background:linear-gradient(135deg,#0f172a,#1e1b4b);border:1px solid #1e293b;border-radius:14px;padding:30px;margin-bottom:22px}
  .hero h1{font-size:28px;color:#f1f5f9;font-weight:700;letter-spacing:0.5px}
  .hero .sub{color:#94a3b8;font-size:13px;margin-top:8px}
  .hero .stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px}
  .stat{background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:12px 18px}
  .stat .n{font-size:22px;font-weight:700;color:#818cf8;font-family:monospace}
  .stat .l{font-size:11px;color:#64748b;margin-top:2px}
  .stat.clickable{cursor:pointer;transition:.15s;user-select:none}
  .stat.clickable:hover{border-color:#6366f1;transform:translateY(-2px)}
  .stat.clickable.active{border-color:#6366f1;background:#1e1b4b;box-shadow:0 0 0 1px #6366f1}
  .filterbar{color:#64748b;font-size:12px;margin:16px 0 6px}
  .filterbar b{color:#818cf8;font-family:monospace}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  a.card{display:block;background:#0f172a;border:1px solid #1e293b;border-radius:10px;padding:16px;text-decoration:none;color:inherit;transition:.18s}
  a.card:hover{border-color:#6366f1;transform:translateY(-3px);box-shadow:0 8px 24px #00000050}
  .card.missing{opacity:.55;border-style:dashed}
  .card.missing:hover{transform:none;border-color:#334155;box-shadow:none}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start}
  .s-name{font-size:17px;font-weight:700;color:#f1f5f9}
  .s-code{font-size:11px;color:#64748b;margin-top:3px}
  .s-price{text-align:right}
  .price{font-size:22px;font-weight:700;font-family:monospace}
  .chg{font-size:13px;font-family:monospace;margin-top:2px}
  .card-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:14px 0}
  .m{display:flex;justify-content:space-between;font-size:13px;border-bottom:1px solid #1a2336;padding-bottom:5px}
  .m span{color:#94a3b8}
  .m b{font-family:monospace;color:#e2e8f0}
  .card-tags{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tag{font-size:11px;padding:3px 9px;border-radius:5px;background:#1e1b4b;color:#818cf8}
  .tag.ext{background:transparent;border:1px solid #334155;color:#94a3b8;margin-left:auto}
  .foot{text-align:center;color:#475569;font-size:11px;margin-top:34px;border-top:1px solid #1e293b;padding-top:18px}
  .foot a{color:#6366f1;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>🛠️ [[TITLE]]</h1>
    <div class="sub">[[SUB]]</div>
    <div class="stats">
      [[STATS]]
    </div>
  </div>

  <div class="filterbar">当前筛选：<b id="filterName">全部标的</b> · 共 <b id="filterCount">[[FILTER_COUNT]]</b> 只（点击上方指标卡可快速筛选）</div>

  <div class="grid">
    [[CARDS]]
  </div>

  <div class="foot">
    [[FOOT_SRC]]<br>
    Powered by <a href="https://github.com/isnotry/StockVal" target="_blank" rel="noopener noreferrer" style="color:#818cf8;text-decoration:underline;text-decoration-color:#334155;text-underline-offset:2px">StockVal</a> · <a href="https://github.com/isnotry/StockVal" target="_blank" rel="noopener noreferrer" style="color:#818cf8;text-decoration:underline;text-decoration-color:#334155;text-underline-offset:2px">GitHub 开源仓库</a><br>
    ⚠️ 本报告由AI自动生成，仅供研究参考，<b style="color:#94a3b8">不构成投资建议</b>。
  </div>
</div>

  <script>
    const FILTER_LABELS = {
      all: "全部标的",
      lowpe: "PE<15 低估",
      highdy: "股息率>5%",
      up: "当日上涨"
    };
    function applyFilter(el) {
      document.querySelectorAll('.stat.clickable').forEach(s => s.classList.remove('active'));
      el.classList.add('active');
      const f = el.getAttribute('data-filter');
      let shown = 0;
      document.querySelectorAll('.card').forEach(c => {
        if (c.dataset.missing === '1') {
          const show = (f === 'all');
          c.style.display = show ? '' : 'none';
          if (show) shown++;
          return;
        }
        const pe = parseFloat(c.dataset.pe) || 0;
        const dy = parseFloat(c.dataset.dy) || 0;
        const chg = parseFloat(c.dataset.chg) || 0;
        let show = true;
        if (f === 'lowpe') show = pe > 0 && pe < 15;
        else if (f === 'highdy') show = dy > 5;
        else if (f === 'up') show = chg >= 0;
        c.style.display = show ? '' : 'none';
        if (show) shown++;
      });
      document.getElementById('filterName').textContent = FILTER_LABELS[f];
      document.getElementById('filterCount').textContent = shown;
    }
  </script>
</body>
</html>
