[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stockval"
version = "0.1.0"
description = "A股全维估值体检 CLI — 七维数据透视 + 暗色单页报告 + 可保存的手机分享卡片"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "isnotry" }]
keywords = ["stock", "valuation", "a-share", "cli", "report"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["requests"]

[project.urls]
Repository = "https://github.com/isnotry/StockVal"
Issues = "https://github.com/isnotry/StockVal/issues"

[project.scripts]
stockval = "stockval.cli:main"

[tool.setuptools.packages.find]
include = ["stockval*"]

[tool.setuptools.package-data]
"*" = ["*.html"]
